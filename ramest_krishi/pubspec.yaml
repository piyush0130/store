name: ramest_krishi
description: A production-ready Agriculture ERP for Ramest Krishi Sewa Kendra.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  get_it: ^7.7.0 # Explicit DI locator as requested

  # Routing
  go_router: ^14.0.0

  # Backend & Offline Database
  supabase_flutter: ^2.5.0
  sqflite: ^2.3.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Security & Biometrics
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.1.0
  local_auth: ^2.2.0
  crypto: ^3.0.3

  # UI & Theming
  intl: ^0.19.0
  responsive_builder: ^0.7.1 # Responsive layouts
  fl_chart: ^0.66.0 # Dashboard charting

  # Hardware & Utilities
  mobile_scanner: ^5.0.0 # Barcode/QR
  image_picker: ^1.1.0 # Camera/Gallery
  uuid: ^4.3.3 # Offline ID generation
  
  # Billing & POS
  pdf: ^3.10.7
  printing: ^5.12.0
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0
  csv: ^6.0.0
  workmanager: ^0.5.2
  connectivity_plus: ^6.0.3
  sqflite_common_ffi_web: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
